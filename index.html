    <script>
      // Motion is opt-in: content is visible unless this class is present.
      // If the reveal system has not started within 4s, drop the class so nothing stays hidden.
      ;(function () {
        var root = document.documentElement
        var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)')
        if (mq && mq.matches) return
        root.classList.add('motion')
        setTimeout(function () {
          if (!window.__revealReady) root.classList.remove('motion')
        }, 4000)
      })()
    </script>
